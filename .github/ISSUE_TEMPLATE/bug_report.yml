name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — see
        [SECURITY.md](https://github.com/gysosin/SysSentient/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `sys-daemon --version`.
    validations: { required: true }
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04, amd64
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        `journalctl -u sys-sentient`, or the daemon's output. Redact anything
        sensitive — logs can contain hostnames and paths.
      render: shell

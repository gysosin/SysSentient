name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        # -race catches the concurrency bugs a metrics daemon is prone to;
        # the collector loop, the WebSocket hub and the alert evaluator all
        # touch shared state from different goroutines.
        run: go test ./... -race

      - name: Lint
        # v8 of the action installs golangci-lint v2, which is what
        # .golangci.yml is written for. The v6 action installs the v1 line,
        # whose final release (1.64.8) is built with Go 1.24 and refuses to
        # run against this module's `go 1.25.10` directive.
        #
        # Pinned rather than `latest`: a lint gate that silently changes its
        # own ruleset can turn a previously-green commit red with no code
        # change, which is how a gate stops being trusted.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build daemon
        run: go build -o /tmp/sys-sentient ./cmd/daemon

      - name: Smoke test the daemon
        # Nothing previously ever RAN the built binary in CI. A daemon that
        # compiles but panics on boot would have shipped unnoticed.
        run: |
          set -euo pipefail
          /tmp/sys-sentient --version
          SYS_SENTIENT_DATABASE_PATH=/tmp/smoke.db /tmp/sys-sentient &
          DAEMON_PID=$!
          trap 'kill "$DAEMON_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "daemon is healthy"
              curl -fsS http://127.0.0.1:8080/health
              curl -fsS http://127.0.0.1:8080/metrics | head -5
              exit 0
            fi
            sleep 1
          done
          echo "daemon did not become healthy in time" >&2
          exit 1

  cross-platform:
    name: Cross-platform build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Windows and macOS have their own log-source and machine-identity
      # implementations behind build tags. Nothing ever compiled them, so a
      # break there could only be found by a user on that platform.
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test platform-specific packages
        run: go test ./internal/logs/... ./internal/hostid/... ./internal/collector/...

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs here as well as in the deploy workflow, so a broken landing page
      # fails the pull request rather than only failing after merge.
      - name: Verify the site
        run: python3 tool/verify_site.py

  frontend:
    name: Web dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check dashboard
        run: npm run typecheck

      - name: Run dashboard tests
        run: npm test

      - name: Build dashboard
        run: npm run build

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --pull -t sys-sentient:ci .
